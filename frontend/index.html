<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Offline First</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <div class="auth-card">
                <h1 class="app-title">📝 Notes</h1>
                <p class="app-subtitle">Your thoughts, always with you</p>
                
                <form id="auth-form" class="auth-form">
                    <div id="name-group" class="form-group" style="display: none;">
                        <input type="text" id="name-input" placeholder="Name (optional)">
                    </div>
                    <div class="form-group">
                        <input type="email" id="email-input" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password-input" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-primary" id="auth-submit">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </form>
                
                <div class="auth-toggle">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button type="button" id="auth-toggle-btn" class="link-btn">Sign Up</button>
                </div>
                
                <div id="auth-error" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="logo">📝 Notes</h1>
                <div class="sync-status" id="sync-status">
                    <span class="sync-indicator offline"></span>
                    <span class="sync-text">Offline</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="search-btn" title="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="logout-btn" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div id="search-bar" class="search-bar" style="display: none;">
            <input type="text" id="search-input" placeholder="Search notes...">
            <button class="icon-btn" id="close-search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Sidebar -->
            <aside class="sidebar">
                <button class="btn-primary new-note-btn" id="new-note-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New Note</span>
                </button>
                
                <div class="notes-list" id="notes-list">
                    <!-- Notes will be dynamically inserted here -->
                </div>
            </aside>

            <!-- Editor -->
            <section class="editor-section">
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h2>No note selected</h2>
                    <p>Create a new note or select one from the sidebar</p>
                </div>

                <div id="editor-container" class="editor-container" style="display: none;">
                    <div class="editor-header">
                        <input type="text" id="note-title" class="note-title-input" placeholder="Untitled">
                        <div class="editor-actions">
                            <button class="icon-btn" id="save-note" title="Save">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                    <polyline points="7 3 7 8 15 8"></polyline>
                                </svg>
                            </button>
                            <button class="icon-btn danger" id="delete-note" title="Delete">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="editor-toolbar">
                        <button class="toolbar-btn" data-format="bold" title="Bold">
                            <strong>B</strong>
                        </button>
                        <button class="toolbar-btn" data-format="italic" title="Italic">
                            <em>I</em>
                        </button>
                        <button class="toolbar-btn" data-format="underline" title="Underline">
                            <u>U</u>
                        </button>
                        <div class="toolbar-divider"></div>
                        <button class="toolbar-btn" data-format="h1" title="Heading 1">H1</button>
                        <button class="toolbar-btn" data-format="h2" title="Heading 2">H2</button>
                        <div class="toolbar-divider"></div>
                        <button class="toolbar-btn" data-format="ul" title="Bullet List">• List</button>
                        <button class="toolbar-btn" data-format="ol" title="Numbered List">1. List</button>
                    </div>
                    <div class="editor-content">
                        <div id="note-editor" class="note-editor" contenteditable="true" placeholder="Start writing..."></div>
                    </div>
                    <div class="editor-footer">
                        <div class="tags-container" id="tags-container">
                            <input type="text" id="tag-input" class="tag-input" placeholder="Add tags...">
                        </div>
                        <div class="editor-meta">
                            <span id="save-status" class="save-status">Saved</span>
                            <span id="note-date" class="note-date"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
